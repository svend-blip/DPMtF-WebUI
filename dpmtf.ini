[app]
port = 9130
host = 0.0.0.0
default_locale = en-US

[database]
path = databases/dpmtf.db

[paths]
projects_base_dir =
governance_dir = docs/governance-templates-v2
log_dir = logs
exports_dir = exports
opencode_bin =

[logging]
level = INFO
file = logs/app.log

[projects]
father_project = DPMtF-WebUI
child_projects = ENO
reference_projects = ai-pc-resource-webui-v3

[integration]
# Base URLs for the companion allocator web UIs. Ports are data, not code:
# the frontend fetches these via /api/bridge-v2/ui-links — never hardcodes.
allocator_web_url = http://localhost:9141
harness_web_url = http://localhost:9142

[knowledge]
# Knowledge retrieval is disabled by default. The provider defaults to
# ``none`` (no-op); DPMtF execution is byte-for-byte unchanged until a
# human enables retrieval and selects a real provider.
enabled = true
provider = leann
scope = dpmtf-webui
top_k = 8
max_context_tokens = 12000
max_document_chars = 20000
# LEANN recomputes passage embeddings on every search. Do not set
# enabled = true while a resident local model (FreeToken, Ollama,
# llama.cpp) holds the GPU.
# min_free_vram_mib is set from a measured peak, never lowered to make a
# refusal go away. Measured 2026-09-14 on this host: an in-process LEANN
# search peaks at +2.4 GB VRAM and completes with 3.1 GB free, next to a
# resident FreeToken (131k KV, memory ratio 0.79 -> 25.8 GB) and a resident
# gemma3:4b at 8k context (2.7 GB). The old value 4096 refused that working
# configuration.
min_free_vram_mib = 2500
index_dir = .local/share/dpmtf/knowledge_index
# LEANN search runs in-process by default (use_daemon=False), so no
# hnsw_embedding_server daemon stays resident after a search. The daemon
# mode remains an explicit opt-in; its three failure modes are why it is
# not the default. Measured 2026-09-14 on the dpmtf-webui store (656
# passages, free GPU):
#   mode                | per search             | resident afterwards
#   daemon (today)      | 7.1 s cold, 1.0 s warm | daemon 1.6-2.2 GB, 900 s TTL
#   use_daemon=False    | 8.3-9.3 s every time   | nothing
# Same top-3 results on three queries. One retrieval per dispatch makes 9
# seconds acceptable; the daemon's failure modes (stdout/stderr
# inheritance, resident VRAM, 30 s ZMQ timeout) are not.
leann_use_daemon = false
