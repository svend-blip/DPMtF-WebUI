<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="locale" content="" />
    <title data-slot="lbl_page_title">Loading...</title>
    <link rel="stylesheet" href="/static/css/dpmtf-theme.css" />
</head>
<body>
    <main class="container">
        <div class="header-row">
            <h1 data-slot="lbl_heading_main">Loading...</h1>
            <div class="lang-selector">
                <label for="lang-dropdown" class="lang-label">Language</label>
                <select id="lang-dropdown">
                    <!-- Populated dynamically from /api/available-languages -->
                </select>
            </div>
        </div>

        <!-- Daily -->
        <section class="panel-group" id="pg-daily">
            <div class="panel-group-header" data-group="daily">
                <h2 data-slot="pg_daily">📋 Daily</h2>
                <span class="panel-group-toggle">▼</span>
            </div>
            <div class="panel-group-body">
                <section id="template-manager-section">
                    <h2 data-slot="lbl_panel_templates">Prompt Templates</h2>
                    <div id="template-manager-content"></div>
                </section>
            </div>
        </section>

        <!-- Journals -->
        <section class="panel-group" id="pg-journals">
            <div class="panel-group-header" data-group="journals">
                <h2 data-slot="pg_journals">📓 Journals</h2>
                <span class="panel-group-toggle">▼</span>
            </div>
            <div class="panel-group-body">
            </div>
        </section>

        <!-- Reports -->
        <section class="panel-group" id="pg-reports">
            <div class="panel-group-header" data-group="reports">
                <h2 data-slot="pg_reports">📊 Reports</h2>
                <span class="panel-group-toggle">▼</span>
            </div>
            <div class="panel-group-body">
            </div>
        </section>

        <!-- Periodic -->
        <section class="panel-group" id="pg-periodic">
            <div class="panel-group-header" data-group="periodic">
                <h2 data-slot="pg_periodic">🔄 Periodic</h2>
                <span class="panel-group-toggle">▼</span>
            </div>
            <div class="panel-group-body">
            </div>
        </section>

        <!-- Setup -->
        <section class="panel-group" id="pg-setup">
            <div class="panel-group-header" data-group="setup">
                <h2 data-slot="pg_setup">⚙️ Setup</h2>
                <span class="panel-group-toggle">▼</span>
            </div>
            <div class="panel-group-body">
                <button id="system-setup-btn" type="button" data-slot="lbl_btn_system_setup">System Setup</button>
                <div id="system-setup-drawer" class="drawer">
                    <div id="drawer-content"></div>
                </div>

                <!-- Bridge Setup -->
                <section id="bridge-setup-section">
                    <h2 data-slot="lbl_bridge_panel_title">Bridge Setup</h2>
                    <div id="bridge-status-content"></div>

                    <!-- Roles -->
                    <section id="bridge-roles-section">
                        <h3 data-slot="lbl_bridge_roles_title">Roles</h3>
                        <div class="bridge-btn-row">
                            <button id="bridge-add-role-btn" type="button" data-slot="lbl_bridge_role_add">Add Role</button>
                            <button id="bridge-export-roles-btn" type="button" data-slot="lbl_bridge_export_roles">View Roles</button>
                        </div>
                        <div id="bridge-roles-list-container" class="dpmtf-card-grid"></div>
                    </section>

                    <!-- Flows -->
                    <section id="bridge-flows-section">
                        <h3 data-slot="lbl_bridge_flows_title">Flows</h3>
                        <div class="bridge-btn-row">
                            <button id="bridge-add-flow-btn" type="button" data-slot="lbl_bridge_flow_add">Add Flow</button>
                            <button id="bridge-export-flows-btn" type="button" data-slot="lbl_bridge_export_flows">View Flows</button>
                        </div>
                        <div id="bridge-flows-list-container" class="dpmtf-card-grid"></div>
                    </section>

                    <!-- Steps -->
                    <section id="bridge-steps-section">
                        <h3 data-slot="lbl_bridge_steps_title">Steps</h3>
                        <div class="bridge-btn-row">
                            <select id="bridge-steps-flow-select" data-slot="lbl_bridge_select_flow">Select Flow</select>
                            <button id="bridge-add-step-btn" type="button" data-slot="lbl_bridge_step_add">Add Step</button>
                        </div>
                        <div id="bridge-steps-list-container" class="dpmtf-card-grid"></div>
                    </section>

                    <!-- Export -->
                    <section id="bridge-export-section">
                        <h3 data-slot="lbl_bridge_export">Export</h3>
                        <div id="bridge-export-content"></div>
                    </section>
                </section>

                <section id="db-status-section">
                    <h2 data-slot="lbl_panel_db_status">Database Status</h2>
                    <div id="db-status-content"></div>
                </section>
            </div>
        </section>
    </main>
    <script src="/static/js/dpmtf-app.js"></script>
</body>
</html>
