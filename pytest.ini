[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short

[coverage:run]
source = app
omit =
    tests/*
    scripts/bridgeV002/*
    venv/*
    __pycache__/*

[coverage:report]
show_missing = True
skip_empty = True
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError