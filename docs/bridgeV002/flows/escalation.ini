[flow]
name = Escalation
description = Ad-hoc escalation flow: Review <-> Architect guidance loop
steps = review_to_architect, architect_answer_to_review

# ── Step 1: Review escalates question to Architect ────
[step:review_to_architect]
from_role = review_heavy1
to_role = architect
deliverable_dir = reviewtoarchitect
deliverable_pattern = {ID}-handoff.md
pre_dispatch_script =
post_dispatch_script =
error_msg = Escalation failed. Present question to Architect manually.

# ── Step 2: Architect answers back to Review ──────────
[step:architect_answer_to_review]
from_role = architect
to_role = review_heavy1
deliverable_dir = architecttoreview
deliverable_pattern = {ID}-callback.md
pre_dispatch_script =
post_dispatch_script =
error_msg = Failed to deliver architect answer back to review.
