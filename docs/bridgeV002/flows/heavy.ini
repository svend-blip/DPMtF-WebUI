[flow]
name = Heavy
description = Full chain: Architect -> Implementer -> Review1 -> Review2 -> Human
steps = architect_to_implementer, implementer_to_review_heavy1, review_heavy1_to_heavy2, review_heavy2_to_human

# ── Step 1: Architect delivers to Implementer ────────
[step:architect_to_implementer]
from_role = architect
to_role = implementer
deliverable_dir = reviewtoimplementor
deliverable_pattern = {ID}-handoff.md
pre_dispatch_script =
post_dispatch_script =
error_msg = Failed to deliver handoff to implementer.

# ── Step 2: Implementer delivers completion to Review1 ──
[step:implementer_to_review_heavy1]
from_role = implementer
to_role = review_heavy1
deliverable_dir = implementertoreview
deliverable_pattern = {ID}-callback.md
pre_dispatch_script =
post_dispatch_script =
error_msg = Failed to deliver completion signal to review.

# ── Step 3: Review1 continues to Review2 ──────────────
[step:review_heavy1_to_heavy2]
from_role = review_heavy1
to_role = review_heavy2
deliverable_dir = architecttoreview
deliverable_pattern = {ID}-callback.md
pre_dispatch_script =
post_dispatch_script =
error_msg = Failed to deliver response to review2.

# ── Step 4: Review2 delivers verdict to Human ─────────
[step:review_heavy2_to_human]
from_role = review_heavy2
to_role = human
deliverable_dir = implementertoreview
deliverable_pattern = {ID}-review-verdict.md
pre_dispatch_script =
post_dispatch_script =
error_msg = Failed to deliver verdict. Present to Human manually.

# ── Optional: Reverse chain for escalation (Review -> Architect) ──
[step:review_to_architect_escalation]
from_role = review_heavy1
to_role = architect
deliverable_dir = reviewtoarchitect
deliverable_pattern = {ID}-handoff.md
pre_dispatch_script =
post_dispatch_script =
error_msg = Escalation failed. Present question to Architect manually.
