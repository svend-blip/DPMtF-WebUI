[roles]
# Liste af rolle-navne der er defineret
available = architect, implementer, review_heavy1, review_heavy2, reviewer_lite

# ── Rolle: architect ──────────────────────────────────
[role:architect]
tmux_session = claude_architect
start_cmd = cd {PROJECT_ROOT} && claude
model_type = cloud
cloud_model = deepseek-v4-pro:cloud
ollama_model =
setup_script = {SCRIPTS_DIR}/role_setup.py
teardown_script = {SCRIPTS_DIR}/role_teardown.py
deliver_error_msg = Architect session stopped unexpectedly. Check tmux status with 'tmux ls'.

# ── Rolle: implementer ────────────────────────────────
[role:implementer]
tmux_session = claude_implementer
start_cmd = OPENCODE_CONFIG_DIR={PROJECT_ROOT}/.config/opencode-roles/implementer OPENCODE_CONFIG={PROJECT_ROOT}/.config/opencode-roles/implementer/opencode.json opencode
model_type = ollama
cloud_model =
ollama_model = qwen3.6:27b-q4_K_M
setup_script = {SCRIPTS_DIR}/role_setup.py
teardown_script = {SCRIPTS_DIR}/role_teardown.py
deliver_error_msg = Implementer session stopped unexpectedly. Start manually in tmux.

# ── Rolle: review (heavy, first pass) ─────────────────
[role:review_heavy1]
tmux_session = claude_review
start_cmd = cd {PROJECT_ROOT} && claude
model_type = cloud
cloud_model = deepseek-v4-flash:cloud
ollama_model =
setup_script = {SCRIPTS_DIR}/role_setup.py
teardown_script = {SCRIPTS_DIR}/role_teardown.py
deliver_error_msg = Review session stopped unexpectedly. Check tmux status with 'tmux ls'.

# ── Rolle: review (heavy, second pass) ────────────────
[role:review_heavy2]
tmux_session = claude_review_2
start_cmd = cd {PROJECT_ROOT} && claude
model_type = cloud
cloud_model = deepseek-v4-flash:cloud
ollama_model =
setup_script = {SCRIPTS_DIR}/role_setup.py
teardown_script = {SCRIPTS_DIR}/role_teardown.py
deliver_error_msg = Review2 session stopped unexpectedly. Start manually.

# ── Rolle: review (lite) ──────────────────────────────
[role:reviewer_lite]
tmux_session = claude_review_lite
start_cmd = OPENCODE_CONFIG_DIR={PROJECT_ROOT}/.config/opencode-roles/review OPENCODE_CONFIG={PROJECT_ROOT}/.config/opencode-roles/review/opencode.json opencode
model_type = ollama
cloud_model =
ollama_model = qwen3.6:27b-q4_K_M
setup_script = {SCRIPTS_DIR}/role_setup.py
teardown_script = {SCRIPTS_DIR}/role_teardown.py
deliver_error_msg = Lite review session stopped unexpectedly. Start manually in tmux.
