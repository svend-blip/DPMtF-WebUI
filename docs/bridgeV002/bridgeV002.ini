[bridge]
# Hvor bridge-data (artefakter, state, logs) gemmes
bridge_dir = {BRIDGE_DIR}

# Default flow at køre hvis ingen specificeres
default_flow = heavy

# Max antal parallele flows — altid 1
max_parallel = 1

# Timeout i sekunder for auto-abort på stuck handoff (0 = deaktiveret)
dispatch_timeout = 0

[paths]
flows_dir   = {PROJECT_ROOT}/docs/bridgeV002/flows
roles_dir   = {PROJECT_ROOT}/docs/bridgeV002/roles
scripts_dir = {PROJECT_ROOT}/scripts/bridgeV002
database_path = {PROJECT_ROOT}/databases/dpmtf.db

# Migration fra eksisterende bridge
[migration]
legacy_bridge_dir = {BRIDGE_DIR}/legacy-bridge
migrated = false
